# This is a Declarative Automation Bundle definition for CICDPipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: CICDPipeline
  uuid: 6a22673d-e6e4-40fa-81dc-27b69d010472

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616866819876.16.azuredatabricks.net
    variables:
      catalog: databrucks-ci-cd-pipelines
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405616866819876.16.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/sathish.skyuv@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sathish.skyuv@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: databrucks-ci-cd-pipelines
      schema: prod
    permissions:
      - user_name: sathish.skyuv@gmail.com
        level: CAN_MANAGE

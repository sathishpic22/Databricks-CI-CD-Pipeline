# Job to run the Order_Data_Transformation notebook.

resources:
  jobs:
    order_data_transformation_job:
      name: Order_Data_Transformation

      trigger:
        # Run this job every day, exactly one day from the last run.
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: order_data_transformation
          notebook_task:
            notebook_path: ../src/Order_Data_Transformation.ipynb

# Job to run the Order_Data_Transformation notebook.
resources:
  jobs:
    order_data_transformation_job:
      name: Order_Data_Transformation

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: order_data_transformation
          notebook_task:
            notebook_path: ../src/Order_Data_Transformation.ipynb
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

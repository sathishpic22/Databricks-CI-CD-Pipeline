name: Deploy Databricks production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
defaults:
      run:
        working-directory: CICDPipeline
        
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Download repository from GitHub
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Install uv
        run: python -m pip install uv

      - name: Check Databricks login
        run: databricks current-user me

      - name: "CI - Check production bundle"
        run: databricks bundle validate -t prod

      - name: "CI - Copy production files into live"
        run: databricks bundle sync -t prod --full

      - name: "CD - Deploy production bundle"
        run: databricks bundle deploy -t prod
